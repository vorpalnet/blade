<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Report · BLADE Dashboard</title>
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="dashboard.css">
	<script src="/blade/portal/brand/theme.js"></script>
</head>
<body>

	<header class="topbar">
		<a class="brand" href="/blade/dashboard/">
			<span class="brand__pill"><img class="brand__logo" src="/blade/portal/brand/VorpalBoy_lightpurple.svg" alt="Vorpal">Dashboard</span>
		</a>
		<div class="spacer"></div>
		<nav class="nav">
			<a href="./">Overview</a>
			<a href="/blade/tuning/">Tuning</a>
		</nav>
		<span data-theme-switch></span>
	</header>

	<main>
		<p class="eyebrow"><a href="./">&larr; Overview</a></p>
		<h1 id="r-title">Report</h1>
		<p class="lede" id="r-lede"></p>

		<form class="toolbar" onsubmit="return false">
			<label>Range
				<select id="f-days"></select>
			</label>
			<label>Domain
				<select id="f-domain"><option value="">all domains</option></select>
			</label>
			<label>Time zone
				<select id="f-tz"></select>
			</label>
			<label title="One caller's calls: the account an application filed them under. Needs a grant that shows content; a department finds the caller only on its own calls.">Account
				<input type="search" id="f-account" size="12" placeholder="any caller">
			</label>
			<label class="check"><input type="checkbox" id="f-sample"> Include sample data</label>
			<button type="button" id="f-refresh">Refresh</button>
			<span class="toolbar__status" id="f-asof"></span>
		</form>

		<section class="grid" id="sections"></section>

		<p class="foot">Live query on every load and refresh &middot; the link in your address bar keeps these settings &middot;
		charts drawn with <a href="vendor/LICENSE-d3.txt">D3</a></p>
	</main>

	<script src="vendor/d3.min.js"></script>
	<script src="vendor/topojson-client.min.js"></script>
	<script src="vorpal/geo.js"></script>
	<script src="charts.js"></script>
	<script src="reports.js"></script>
</body>
</html>
