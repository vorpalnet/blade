<html>
<head>
<title>Flow Model Properties</title>
	<link rel="stylesheet" href="/blade/portal/brand/brand.css">
	<link rel="stylesheet" href="css/panels.css">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

</head>
<body>

<div id="config-view">
	<label>Default Application</label>
	<input id="config-default-app" type="text" placeholder="e.g. b2bua" />
	<div class="config-hint">Used when no transition matches.</div>

	<!-- The rest of the FSMAR config is real and editable, just not here: this
	     editor owns the routing topology, the Configurator owns everything
	     else. Saying so beats leaving operators to assume defaultApplication is
	     all there is. Those fields survive every round-trip through this editor
	     untouched. One line is enough to say it; the panel is a working
	     surface, not a place to read. -->
	<div class="config-aside">
		<p>Logging, analytics, the event bus and overrides live in this same config,
			edited in the <a href="/blade/configurator/configurator.html?schema=fsmar"
				target="_blank" rel="noopener">Configurator</a>.</p>
	</div>
</div>

</body>
</html>
