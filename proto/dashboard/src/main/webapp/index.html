<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>BLADE Dashboard</title>
	<link rel="icon" href="/blade/portal/brand/favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="dashboard.css">
</head>
<body class="board">

	<header class="topbar topbar--board">
		<a class="brand" href="/blade/portal/">
			<img class="brand__logo" src="/blade/portal/brand/vorpal_logo_lightpurple.svg" alt="Vorpal">
			<span class="brand__name">Dashboard<small>OCCAS &middot; BLADE</small></span>
		</a>
		<div class="seg" id="range" title="Range for the call analytics. Server health and operations are always live."></div>
		<select class="tz" id="scope" title="Which domain the board shows. This domain is read live; every other one from its minute samples."></select>
		<div class="spacer"></div>
		<span class="clock" id="clock"></span>
		<select class="tz" id="tz" title="Time zone for every time on the board. The data is UTC."></select>
		<nav class="nav">
			<a href="/blade/portal/">Portal</a>
			<a href="/blade/tuning/">Tuning</a>
			<a href="/blade/balancer/">Balancer</a>
		</nav>
		<span class="status" id="status"><span class="dot"></span><span id="statusText">loading…</span></span>
	</header>

	<main class="board__grid">
		<section class="kpis" id="kpis"></section>

		<section class="panel panel--cluster" data-panel="cluster"></section>
		<section class="panel panel--traffic" data-panel="traffic"></section>
		<section class="panel panel--ops" data-panel="ops"></section>

		<section class="panel panel--outcomes" data-panel="outcomes"></section>
		<section class="panel panel--apps" data-panel="apps"></section>
		<section class="panel panel--risk" data-panel="risk"></section>
	</main>

	<script src="vendor/d3.min.js"></script>
	<script src="charts.js"></script>
	<script src="reports.js"></script>
	<script src="board.js"></script>
</body>
</html>
