<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Test Console · BLADE</title>
	<link rel="stylesheet" href="/blade/portal/brand/brand.css">
	<script src="/blade/portal/brand/theme.js"></script>
	<script src="/blade/portal/brand/shell.js" data-context="/blade/test-console" defer></script>
	<link rel="stylesheet" href="console.css">
	<link rel="icon" type="image/svg+xml" href="/blade/test-console/favicon.svg">
</head>
<body>
<div class="vorpal-app">

	<header class="vorpal-topbar">
		<a class="vorpal-brand" href="/blade/dashboard/" title="Back to the dashboard">
			<img class="vorpal-brand-mark" src="/blade/portal/brand/vorpal_splotch.svg" alt="Vorpal">
			<span class="vorpal-brand-text">
				<span class="vorpal-brand-product">BLADE Test Console</span>
				<span class="vorpal-brand-tagline">Cluster-Wide SIP Test Runs</span>
			</span>
		</a>
		<a class="vorpal-appmark" href="/blade/test-console/">Test Console</a>
		<nav class="vorpal-nav" aria-label="Primary">
			<a href="console.html" class="vorpal-active">Console</a>
			<a href="docs/index.html">Documentation</a>
			<a href="/blade/configurator/">Edit Scenarios</a>
		</nav>
		<div class="vorpal-topbar-right">
			<span class="vorpal-pill" id="refresh-pill" title="Auto-refresh">refresh: 2s</span>
		</div>
	</header>

	<main class="vorpal-main">
		<div class="vorpal-page">

			<!-- Run controls -->
			<section class="tc-controls vorpal-panel">
				<div class="vorpal-panel-head"><h2 class="vorpal-panel-title">Load Run</h2></div>
				<div class="tc-controls-grid">
					<div class="vorpal-field">
						<label for="ctl-app">App</label>
						<select id="ctl-app" class="vorpal-input"></select>
					</div>
					<div class="vorpal-field">
						<label for="ctl-scenario">Scenario</label>
						<input id="ctl-scenario" class="vorpal-input" type="text" placeholder="(configured default)">
					</div>
					<div class="vorpal-field">
						<label for="ctl-mode">Mode</label>
						<select id="ctl-mode" class="vorpal-input">
							<option value="">(configured default)</option>
							<option value="cps">cps — calls per second</option>
							<option value="concurrent">concurrent — maintain N calls</option>
						</select>
					</div>
					<div class="vorpal-field">
						<label for="ctl-cps">Target CPS</label>
						<input id="ctl-cps" class="vorpal-input" type="number" min="0" step="0.1" placeholder="per node">
					</div>
					<div class="vorpal-field">
						<label for="ctl-concurrent">Target concurrent</label>
						<input id="ctl-concurrent" class="vorpal-input" type="number" min="0" step="1" placeholder="per node">
					</div>
					<div class="vorpal-field">
						<label for="ctl-maxcalls">Max calls</label>
						<input id="ctl-maxcalls" class="vorpal-input" type="number" min="0" step="1" placeholder="0 = unlimited">
					</div>
					<div class="vorpal-field">
						<label for="ctl-duration">Call duration</label>
						<input id="ctl-duration" class="vorpal-input" type="text" placeholder="e.g. 30s">
					</div>
				</div>
				<div class="tc-actions vorpal-toolbar">
					<button class="vorpal-btn" id="btn-start">Start on all nodes</button>
					<button class="vorpal-btn vorpal-btn-danger" id="btn-stop">Stop</button>
					<button class="vorpal-btn vorpal-btn-danger" id="btn-reset">Reset metrics</button>
					<span class="tc-feedback vorpal-muted" id="ctl-feedback" role="status"></span>
				</div>
			</section>

			<!-- Per-node status -->
			<section class="tc-section">
				<div class="vorpal-panel-head"><h2 class="vorpal-panel-title">Nodes</h2></div>
				<div id="nodes" class="tc-node-grid">
					<p class="tc-empty vorpal-empty">Discovering tester nodes…</p>
				</div>
			</section>

			<!-- Aggregated scenario metrics -->
			<section class="tc-section vorpal-panel">
				<div class="vorpal-panel-head"><h2 class="vorpal-panel-title">Scenario Metrics</h2><span class="vorpal-panel-sub">summed across nodes; latency shows the worst node</span></div>
				<div id="scenarios" class="tc-scroll">
					<p class="tc-empty vorpal-empty">No metrics yet.</p>
				</div>
			</section>

		</div>

		<footer class="vorpal-footer">
			<a href="https://github.com/vorpalnet/blade" target="_blank" rel="noopener" title="Source on GitHub">
				<img src="/blade/portal/brand/vorpal_logo.svg" alt="Vorpal Networks">
			</a>
			<span>&copy; Vorpal Networks 2021&ndash;2026 &middot; MIT License</span>
			<a href="https://github.com/vorpalnet/blade" target="_blank" rel="noopener">View on GitHub</a>
		</footer>
	</main>

</div>
<script src="console.js"></script>
</body>
</html>
