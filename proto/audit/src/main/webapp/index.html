<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access Log · Audit · BLADE</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="/blade/portal/brand/brand.css">
<script src="/blade/portal/brand/theme.js"></script>
<script src="/blade/portal/brand/shell.js" data-context="/blade/audit" defer></script>
<!--
  The examining half of the audit control: one UTC day of access records, newest first.
  Served from this WAR and the portal's shared styles on the same host, with nothing fetched
  from another site, like the recordings page. The API
  decides whether this reader may see the log, and records that they asked either way, so the
  page carries no policy of its own.

  Colour never carries meaning here: a refusal says "Refused" and is marked with a cross.
-->
<style>
  .bar { padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; }
  .bar h1 { font-size: 18px; margin: 0; }
  .bar form { align-items: flex-end; }
  .page .vorpal-note { margin: 0 20px; }
  .page main { padding: 12px 20px 32px; }
  .page main .vorpal-panel { overflow-x: auto; }
  .page main table { min-width: 760px; }
  td.when { white-space: nowrap; font-variant-numeric: tabular-nums; }
  /* A refusal is a filled row AND the word "Refused" with a cross, in bold. */
  tr.refused td { background: var(--vorpal-slate-200); }
  tr.refused td.decision { font-weight: 700; }
  .mono { word-break: break-all; }
  #status { color: var(--vorpal-slate-600); font-size: 13px; }
</style>
</head>
<body>
<div class="vorpal-app">
<header class="vorpal-topbar">
  <a class="vorpal-brand" href="./" title="Audit"><img class="vorpal-brand-mark" src="/blade/portal/brand/vorpal_splotch.svg" alt="Vorpal"></a>
  <a class="vorpal-appmark" href="./">Audit</a>
  <div class="vorpal-topbar-right"></div>
</header>
<div class="page">
<div class="bar">
  <h1>Access log</h1>
  <form id="pick" class="vorpal-toolbar">
    <label class="vorpal-field"><span class="vorpal-label">Day (UTC)</span><input id="day" class="vorpal-input" type="date" required></label>
    <label class="vorpal-field"><span class="vorpal-label">Who</span><input id="who" class="vorpal-input" type="search" placeholder="any"></label>
    <button type="submit" class="vorpal-btn">Show</button>
  </form>
  <span id="status" aria-live="polite"></span>
</div>
<p class="vorpal-note">Every attempt to reach a recording or a transcript is here, permitted or refused. Reading this log is recorded too, and whoever reads it cannot remove that record.</p>
<main>
  <div class="vorpal-panel">
  <table class="vorpal-table">
    <thead><tr><th>When (UTC)</th><th>Who</th><th>Decision</th><th>Tried to</th><th>What</th><th>From</th><th>Rule</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  </div>
</main>
</div>
</div>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  let records = [];

  function today() { return new Date().toISOString().slice(0, 10); }

  function cell(text, cls) {
    const td = document.createElement('td');
    if (cls) td.className = cls;
    td.textContent = text == null ? '' : text;
    return td;
  }

  function show() {
    const who = $('who').value.trim().toLowerCase();
    const body = $('rows');
    body.replaceChildren();
    const shown = records.filter((r) => !who || String((r.data || {}).actor || '').toLowerCase().includes(who));
    for (const r of shown.slice().reverse()) {
      const d = r.data || {};
      // permit, deny, or breakglass: an emergency override, permitted and always worth a look.
      const permitted = d.decision === 'permit' || d.decision === 'breakglass';
      const tr = document.createElement('tr');
      if (!permitted || d.decision === 'breakglass') tr.className = 'refused';
      tr.append(
        cell(String(r.time || '').replace('T', ' ').replace(/\..*$/, ''), 'when'),
        cell(d.actor),
        cell(d.decision === 'breakglass' ? '! Permitted, break glass'
          : permitted ? '✓ Permitted' : '✗ Refused', 'decision'),
        cell(d.action),
        cell([d.resourceKind, d.resourceId].filter(Boolean).join(' '), 'vorpal-mono mono'),
        cell(d.sourceAddress, 'vorpal-mono mono'),
        cell(d.rule || d.reason));
      body.append(tr);
    }
    $('status').textContent = shown.length + ' of ' + records.length + ' records';
  }

  async function load() {
    const [y, m, d] = $('day').value.split('-');
    $('status').textContent = 'Loading…';
    const res = await fetch('api/v1/audit/' + y + '/' + m + '/' + d, { credentials: 'same-origin' });
    if (res.status === 403) {
      records = [];
      show();
      $('status').textContent = 'You may not read the access log. That attempt has been recorded.';
      return;
    }
    if (!res.ok) {
      records = [];
      show();
      const body = await res.json().catch(() => ({}));
      $('status').textContent = body.error || ('The log could not be read (' + res.status + ').');
      return;
    }
    records = (await res.json()).records || [];
    show();
  }

  $('day').value = today();
  $('pick').addEventListener('submit', (e) => { e.preventDefault(); load(); });
  $('who').addEventListener('input', show);
  load();
})();
</script>
</body>
</html>
