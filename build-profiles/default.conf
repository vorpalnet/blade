# Default build profile - the modules built when no profile is specified.
#
# This builds EVERYTHING wired into the reactor (same set as full.conf) EXCEPT
# the proto/ incubator modules, which are built and deployed by hand. That is
# every directory under proto/ — none of them are listed below, so build.sh
# excludes each one with -Dskip.<name>. Use `./build.sh full` to include them.
# (Deliberately not enumerated here: the list changes whenever a module is
# added to or promoted out of proto/, and a stale list reads like a bug report.)
# Add modules to include in the build. Use the full project directory name.
# Anything NOT listed here is excluded via -Dskip.<name>.
#
# One module is intentionally NOT here because it isn't conf-controlled:
#   - admin/javadoc — built via the -Pjavadocs profile (parent pom), which
#     ./build.sh activates by default unless BLADE_SKIP_JAVADOC/--no-javadoc.

# Libraries (framework + shared are required by every WAR)
framework
shared
fsmar

# Admin apps (portal is the entry point + ships the canonical Vorpal brand
# assets under /blade/portal/brand/; redirect owns bare /blade and 302s to it.
# analytics-console is the admin app at /blade/analytics — distinct from the
# analytics cluster SERVICE.)
portal
api
redirect
configurator
files
crud-editor
irouter-editor
flow
tuning
phone
logs
analytics-console
events-console
metrics
callflow
# Admin EAR (apps/admin -> blade-admin.ear). Contents track this conf: each app
# rides its own ear-<name> profile. blade-javadoc.war is included with javadocs.
admin

# Services — each ships as its own WAR in dist/services/ and deploys
# individually (no services EAR; Remote Console can't show status inside one).
# acl is in proto/ now (not shipped); proxy-registrar ships only in
# blade-test.ear.
analytics
context
events
gateway
hold
options
presence
proxy-balancer
proxy-block
proxy-registrar
irouter
queue
tpcc
transfer
crud

# Test apps + the test EAR (apps/test -> blade-test.ear -> engine0).
test-b2bua
test-uac
test-uas
test
