# Full build profile - every library, admin, service, and test module, PLUS the
# proto/ incubator modules (acl, security, test-console) built standalone.
#
# Add modules to include in the build. Use the full project directory name.
# Anything NOT listed here is excluded via -Dskip.<name>.

# Libraries
framework
shared
fsmar

