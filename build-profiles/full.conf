api
redirect
configurator
files
crud-editor
flow
tuning
security
logs
analytics-console
events-console
metrics
callflow
test-console
balancer
# Admin EAR (apps/admin -> blade-admin.ear). Contents track this conf: each app
# rides its own ear-<name> profile. blade-javadoc.war is included with javadocs.
admin

# Services — each ships as its own WAR in dist/services/ and deploys
# individually (no services EAR; Remote Console can't show status inside one).
# acl is now a proto/ module — built standalone here (-> dist/proto).
# events is the engine-tier event bus (CloudEvents ingress + catalog); its
# console is the admin-tier events-console.
acl
analytics
context
events
gateway
hold
options
presence
proxy-balancer
proxy-block
proxy-registrar
irouter
queue
tpcc
transfer
crud

# Incubator (proto/) apps built standalone into dist/proto (not in any product
# EAR). demo = the rep-facing BLADE demo launcher / matrix hub.
demo

# Test apps + the test EAR (apps/test -> blade-test.ear -> engine0).
test-b2bua
test-uac
test-uas
test
