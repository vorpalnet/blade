# desc: the base set PLUS the proto/ incubator apps (acl, demo, player, …)
#
# Full build profile - every library, admin, service, and test module, PLUS the
# proto/ incubator modules, built standalone into dist/<ver>/proto/.
# Each proto module must be listed below to be built; the default profile lists
# none of them, which is the only difference between the two profiles.
#
# Add modules to include in the build. Use the full project directory name.
# Anything NOT listed here is excluded via -Dskip.<name>.

# Libraries
framework
shared
fsmar

# Admin apps (portal ships the canonical Vorpal brand assets under
# /blade/portal/brand/ — every other admin app references them via that URL;
# redirect owns bare /blade and 302s to /blade/portal/)
portal
api
redirect
configurator
files
crud-editor
irouter-editor
flow
tuning
phone
security
logs
analytics-console
events-console
metrics
callflow
test-console
balancer

# The per-tier EARs (blade-admin/services/test/proto.ear) build automatically
# from the WARs selected here — don't list the EARs themselves.

# Services — each ships loose in dist/services/ AND bundled in blade-services.ear.
# acl is a proto/ module (bundled in blade-proto.ear). events is the engine-tier
# event bus (CloudEvents ingress + catalog); its console is events-console.
acl
analytics
context
events
gateway
hold
options
presence
proxy-balancer
proxy-block
proxy-registrar
irouter
queue
tpcc
transfer
crud
webrtc

# Incubator (proto/) apps — loose in dist/proto/ AND bundled in blade-proto.ear
# (deployed by hand). demo = the rep-facing BLADE demo launcher / matrix hub;
# player = the vendor-neutral JSR-309 media player/recorder.
demo
player

# Test apps (loose in dist/test/ AND bundled in blade-test.ear -> engine0).
test-b2bua
test-uac
test-uas
