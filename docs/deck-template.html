<meta charset="utf-8">
<title>{{TITLE}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#E8EBEF; --surface:#FFFFFF; --sunk:#F2F5F8; --ink:#101820; --muted:#54626F;
    --faint:#8B98A5; --line:#D3DAE1; --hair:#E6EBEF;
    --sig:#0A6E85; --sig-bg:#DFEFF3; --med:#A85D0B; --med-bg:#F8EBD9;
    --ok:#2C7350; --brand:#602671;
    --shadow:0 1px 0 rgba(16,24,32,.05), 0 20px 48px -24px rgba(16,24,32,.3);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#06090D; --surface:#0F161E; --sunk:#151E28; --ink:#E9EFF4; --muted:#9DACBA;
      --faint:#66768A; --line:#22303C; --hair:#1A242E;
      --sig:#46C3D8; --sig-bg:#0D2C35; --med:#E5A24E; --med-bg:#33230F;
      --ok:#5CC98A; --brand:#b97cd0;
      --shadow:0 1px 0 rgba(0,0,0,.35), 0 26px 64px -28px rgba(0,0,0,.75);
    }
  }
  :root[data-theme="dark"]{
    --bg:#06090D; --surface:#0F161E; --sunk:#151E28; --ink:#E9EFF4; --muted:#9DACBA;
    --faint:#66768A; --line:#22303C; --hair:#1A242E;
    --sig:#46C3D8; --sig-bg:#0D2C35; --med:#E5A24E; --med-bg:#33230F;
    --ok:#5CC98A; --brand:#b97cd0;
    --shadow:0 1px 0 rgba(0,0,0,.35), 0 26px 64px -28px rgba(0,0,0,.75);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;line-height:1.5;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  code,.mono,pre{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}

  .deck{position:fixed;inset:0;display:grid;place-items:center;padding:clamp(10px,2.4vw,40px)}
  .stage{position:relative;width:min(1240px,100%);height:min(760px,100%);aspect-ratio:16/10}
  .slide{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;box-shadow:var(--shadow);padding:clamp(20px,3.4vw,50px) clamp(22px,3.6vw,54px);
    display:flex;flex-direction:column;overflow:hidden;opacity:0;visibility:hidden;
    transform:translateY(8px);transition:opacity .34s ease,transform .34s ease,visibility 0s linear .34s}
  .slide.on{opacity:1;visibility:visible;transform:none;z-index:2;
    transition:opacity .34s ease,transform .34s ease,visibility 0s}
  @media (prefers-reduced-motion:reduce){.slide{transition:opacity .001s,visibility 0s;transform:none}}

  .eyebrow{font-size:clamp(9.5px,.95vw,11.5px);letter-spacing:.2em;text-transform:uppercase;
    color:var(--sig);font-weight:650;margin:0 0 10px;display:flex;align-items:center;gap:9px}
  .eyebrow::before{content:"";width:20px;height:2px;background:var(--sig)}
  h1{font-size:clamp(26px,4.4vw,52px);line-height:1.04;letter-spacing:-.022em;margin:0 0 16px;
    font-weight:700;text-wrap:balance;max-width:19ch}
  h2{font-size:clamp(19px,2.7vw,33px);line-height:1.1;letter-spacing:-.018em;margin:0;
    font-weight:680;text-wrap:balance;max-width:26ch}
  .sub{margin-top:8px;color:var(--muted);font-size:clamp(12.5px,1.3vw,15.5px);max-width:74ch}
  .sub code{color:var(--ink);font-size:.94em}
  p{margin:0}
  .head{flex:0 0 auto;margin-bottom:clamp(12px,1.9vw,24px)}
  .body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;
    gap:clamp(10px,1.5vw,20px)}
  .lede{font-size:clamp(13.5px,1.45vw,18px);color:var(--muted);max-width:62ch}
  .lede strong{color:var(--ink);font-weight:640}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,2.4vw,36px);align-items:center}
  .two.l{grid-template-columns:1.12fr .88fr}
  .two.r{grid-template-columns:.88fr 1.12fr}
  .stack{display:flex;flex-direction:column;gap:13px;align-items:flex-start}
  .stack > *{max-width:100%}

  pre{margin:0;background:var(--sunk);border:1px solid var(--hair);border-radius:10px;
    padding:clamp(11px,1.4vw,17px);overflow-x:auto;font-size:clamp(10.5px,1.08vw,13px);
    line-height:1.62;color:var(--ink)}
  .k{color:var(--muted)} .s{color:var(--ok)} .n{color:var(--med)} .p{color:var(--faint)}
  .c{color:var(--faint);font-style:italic} .b{color:var(--sig);font-weight:640}
  figure{margin:0}
  figcaption{font-size:11.5px;color:var(--faint);margin-top:9px;text-align:center;max-width:56ch;
    margin-left:auto;margin-right:auto}
  svg text{fill:var(--ink)}
  .lm{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;fill:var(--muted)}

  ul.facts{margin:0;padding:0;list-style:none;display:grid;gap:11px}
  ul.facts li{position:relative;padding-left:17px;font-size:clamp(12px,1.26vw,15px);color:var(--muted)}
  ul.facts li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;
    border-radius:2px;background:var(--sig)}
  ul.facts.m li::before{background:var(--med)}
  ul.facts li b,ul.facts li strong{color:var(--ink);font-weight:640}
  ul.facts li code{color:var(--ink)}

  table{width:100%;border-collapse:collapse;font-size:clamp(10.5px,1.16vw,13.5px)}
  th{text-align:left;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
    font-weight:650;padding:0 10px 7px;border-bottom:1px solid var(--line)}
  td{padding:6px 10px;vertical-align:top;border-bottom:1px solid var(--hair)}
  tr:last-child td{border-bottom:0}
  td.ev{font-family:ui-monospace,Menlo,monospace;font-weight:620;color:var(--ink);white-space:nowrap}
  td.df{color:var(--muted)}
  td.df code{color:var(--sig)}
  .scroll{overflow-x:auto}

  .tag{display:inline-block;font-size:10.5px;font-weight:640;line-height:1.7;
    padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--sunk)}
  .tag.s{color:var(--sig);background:var(--sig-bg);border-color:color-mix(in srgb,var(--sig) 35%,var(--line))}
  .tag.m{color:var(--med);background:var(--med-bg);border-color:color-mix(in srgb,var(--med) 35%,var(--line))}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;
    margin-right:6px;vertical-align:middle}
  .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sq{width:10px;height:3px;border-radius:1px;background:currentColor}

  .pull{font-size:clamp(14px,1.6vw,20px);line-height:1.36;letter-spacing:-.008em}
  .pull .hs{color:var(--sig);font-weight:650} .pull .hm{color:var(--med);font-weight:650}

  .chrome{position:absolute;left:clamp(22px,3.6vw,54px);right:clamp(22px,3.6vw,54px);
    bottom:clamp(10px,1.7vw,20px);display:flex;align-items:center;justify-content:space-between;
    gap:14px;z-index:3;pointer-events:none;font-size:11px;color:var(--faint)}
  .chrome b{color:var(--muted);font-weight:660;letter-spacing:.1em}
  .brand{display:flex;align-items:center;gap:10px;pointer-events:auto}
  .vorpal-mark{height:26px;width:auto;flex:0 0 auto}
  .vorpal-mark .cls-1{fill:var(--brand)}
  .brand-lines{display:flex;flex-direction:column;line-height:1.35}
  .copy{font-size:9.5px;color:var(--faint);letter-spacing:.02em}
  .dots{display:flex;gap:5px;pointer-events:auto}
  .pip{width:6px;height:6px;border-radius:50%;background:var(--line);border:0;padding:0;cursor:pointer;
    transition:background .18s,transform .18s}
  .pip:hover{background:var(--faint)} .pip.on{background:var(--sig);transform:scale(1.3)}
  .pip:focus-visible{outline:2px solid var(--sig);outline-offset:3px}
  .count{pointer-events:auto} .count b{color:var(--ink)}

  .nav{position:fixed;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;
    border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;
    display:grid;place-items:center;z-index:20;box-shadow:var(--shadow);
    transition:color .18s,border-color .18s}
  .nav:hover{color:var(--sig);border-color:var(--sig)}
  .nav:focus-visible{outline:2px solid var(--sig);outline-offset:3px}
  .nav[disabled]{opacity:.28;pointer-events:none}
  .prev{left:clamp(6px,1.6vw,22px)} .next{right:clamp(6px,1.6vw,22px)}
  .tools{position:fixed;top:clamp(8px,1.6vw,18px);right:clamp(8px,1.6vw,20px);display:flex;gap:7px;z-index:20}
  .tool{height:32px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);
    color:var(--muted);font-size:11.5px;font-weight:640;cursor:pointer;
    transition:color .18s,border-color .18s}
  .tool:hover{color:var(--sig);border-color:var(--sig)}
  .tool:focus-visible{outline:2px solid var(--sig);outline-offset:2px}

  .title-slide{justify-content:center}
  .meta{display:flex;flex-wrap:wrap;gap:9px 20px;align-items:center;margin-top:24px;
    font-size:12px;color:var(--muted)}

  @media (max-width:780px){
    .two,.two.l,.two.r{grid-template-columns:1fr;gap:14px}
    .nav{display:none}
  }
</style>

<div class="deck"><div class="stage" id="stage">

     SLIDES START HERE.  Everything outside this block is the shell: palette,

  }
  fs.addEventListener('click', toggleFs);
  document.addEventListener('fullscreenchange', function(){
    fs.textContent = document.fullscreenElement ? 'Exit' : 'Present';
  });

  var themeBtn = document.getElementById('theme'), themeLabel = document.getElementById('themeLabel');
  function prefersDark(){ return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
  function sync(){
    var ex = document.documentElement.getAttribute('data-theme');
    themeLabel.textContent = (ex ? ex==='dark' : prefersDark()) ? 'Light' : 'Dark';
  }
  themeBtn.addEventListener('click', function(){
    var ex = document.documentElement.getAttribute('data-theme');
    var dark = ex ? ex==='dark' : prefersDark();
    document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
    sync();
  });
  sync();

  var start = parseInt((location.hash||'').replace('#',''), 10);
  go(start>=1 && start<=n ? start-1 : 0);
})();
</script>
